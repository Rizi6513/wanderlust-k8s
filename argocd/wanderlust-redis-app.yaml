apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: wanderlust-redis
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Rizi6513/wanderlust-k8s.git
    targetRevision: main
    path: k8s/redis
  destination:
    server: https://kubernetes.default.svc
    namespace: wanderlust
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
